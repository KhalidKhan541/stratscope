name: Agent Fix Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: fetch issues but do not call the LLM or write anything'
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  bugfix:
    name: Run bug-fixing daemon
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOS_JSON: '[{"owner":"KhalidKhan541","repo":"stratscope"}]'
      STRATSCOPE_API_KEY: ${{ secrets.STRATSCOPE_API_KEY }}
      STRATSCOPE_BASE_URL: ${{ secrets.STRATSCOPE_API_URL || 'https://stratscope-api.khalidkhan.workers.dev' }}
      STRATSCOPE_PROJECT_ID: ${{ secrets.STRATSCOPE_PROJECT_ID }}
      STRATSCOPE_AGENT_ID: bugfixer-swe
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3-coder-480b' }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' || 'false' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packages
        if: ${{ github.event_name != 'issue_comment' || contains(github.event.comment.body, '@stratscope-fix') }}
        run: python -m pip install -q -e sdk/python -e agents/bugfixer -e agents/daemon

      - name: List available Groq models
        run: |
          curl -s https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer ${{ secrets.GROQ_API_KEY }}" \
            | python -c "import json,sys; print('\n'.join(sorted(m['id'] for m in json.load(sys.stdin)['data'])))"

      - name: Run bug-fixing daemon
        if: ${{ github.event_name != 'issue_comment' || contains(github.event.comment.body, '@stratscope-fix') }}
        run: python -m daemon.daemon --once
